<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; src: url("assets/SpaceGrotesk-latin.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
        #scene-c-root { position: absolute; inset: 0; font-family: "Space Grotesk", sans-serif; }
        #c-panel { position: absolute; inset: 0; background: #ff4d2e; color: #0d0d0f; }
        #c-count {
          position: absolute; left: 140px; top: 150px; font-size: 560px; font-weight: 700;
          letter-spacing: -0.06em; line-height: 0.8; font-variant-numeric: tabular-nums;
        }
        #c-label { position: absolute; left: 980px; top: 300px; width: 760px; font-size: 96px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
      </style>
      <div id="scene-c-root" data-composition-id="scene-c" data-width="1920" data-height="1080">
        <div id="c-panel">
          <div id="c-count">0</div>
          <div id="c-label">frames per second, all written in code</div>
        </div>
      </div>
      <script>
        (() => {
          // Scene starts at 3.8 s in the video; the 4 s downbeat is local time 0.2.
          const DOWN = 0.2, BEAT = 0.5;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#c-panel",
            { clipPath: "polygon(0% 100%, 100% 130%, 100% 100%, 0% 100%)" },
            { clipPath: "polygon(0% -30%, 100% 0%, 100% 100%, 0% 100%)", duration: 0.4, ease: "expo.inOut" }, DOWN - 0.15);
          tl.fromTo("#c-count", { textContent: 0 },
            { textContent: 30, snap: { textContent: 1 }, duration: 1.2, ease: "power4.out" }, DOWN + 0.1);
          tl.fromTo("#c-label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, DOWN + 2 * BEAT);
          window.__timelines["scene-c"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
