<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; src: url("assets/SpaceGrotesk-latin.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
        #scene-d-root { position: absolute; inset: 0; color: #f4f1ea; font-family: "Space Grotesk", sans-serif; }
        #d-panel { position: absolute; inset: 0; background: #0d0d0f; }
        #d-logo {
          position: absolute; left: 140px; top: 360px; display: flex; align-items: center; gap: 0.35em;
          font-size: 200px; font-weight: 700; letter-spacing: -0.04em;
        }
        #d-rule { position: absolute; left: 140px; top: 640px; width: 1640px; height: 6px; background: #ff4d2e; transform-origin: 0 50%; }
        #d-dot { display: block; width: 0.8em; height: 0.8em; background: #ff4d2e; border-radius: 50%; }
        #d-cta { position: absolute; left: 140px; top: 690px; font-size: 56px; color: #8a877f; }
      </style>
      <div id="scene-d-root" data-composition-id="scene-d" data-width="1920" data-height="1080">
        <div id="d-panel">
          <div id="d-logo"><span id="d-dot"></span><span>Motion Studio</span></div>
          <div id="d-rule"></div>
          <div id="d-cta">The prompt is 10%. The studio is 90%.</div>
        </div>
      </div>
      <script>
        (() => {
          // Scene starts at 5.9 s in the video; the 6 s downbeat is local time 0.1.
          const DOWN = 0.1, BEAT = 0.5;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#d-panel", { clipPath: "inset(100% 0% 0% 0%)" },
            { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "expo.inOut" }, DOWN - 0.05);
          tl.fromTo("#d-logo", { x: -80, scale: 0.9, opacity: 0 },
            { x: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, DOWN + 0.1);
          tl.fromTo("#d-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.inOut" }, DOWN + BEAT - 0.1);
          tl.fromTo("#d-cta", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, DOWN + BEAT);
          window.__timelines["scene-d"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
