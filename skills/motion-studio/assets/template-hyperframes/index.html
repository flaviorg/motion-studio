<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Motion Studio — HyperFrames template</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0d0d0f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d0d0f; }
    </style>
  </head>
  <body>
    <!-- Beat grid (120 BPM): A words 0 s · B cards 2 s · C wipe+counter 4 s · D logo 6 s -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="scene-ab" data-composition-id="scene-ab" data-composition-src="compositions/scene-ab.html"
        data-start="0" data-duration="4.4" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-c" data-composition-id="scene-c" data-composition-src="compositions/scene-c.html"
        data-start="3.8" data-duration="2.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="scene-d" data-composition-id="scene-d" data-composition-src="compositions/scene-d.html"
        data-start="5.9" data-duration="2.1" data-track-index="2" data-width="1920" data-height="1080"></div>
      <!-- Soundtrack synthesized in code by motion-studio (sound/index.html → assets/soundtrack.wav) -->
      <audio id="soundtrack" src="assets/soundtrack.wav" data-start="0" data-duration="8" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
